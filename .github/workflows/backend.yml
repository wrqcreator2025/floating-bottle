name: Backend checks

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Resolve dependencies
        run: go mod tidy
      - name: Export module checksums
        run: base64 -w0 go.sum
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
